<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secrétaire Virtuelle - Cabinet Kiné</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f7fa;
        }
        .chat-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
        }
        .patient { 
            background: #e3f2fd; 
            margin-left: auto; 
            text-align: right;
        }
        .assistant { 
            background: #f1f8e9; 
            margin-right: auto;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-mic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #2e7d32;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-mic.listening {
            background: #d32f2f;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(211, 47, 47, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }
        .status {
            flex-grow: 1;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
        .input-text {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .input-text input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .input-text button {
            padding: 12px 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2 style="text-align: center; color: #2e7d32; margin-bottom: 20px;">
            🏥 Cabinet de Kinésithérapie
        </h2>
        
        <div class="messages" id="messages">
            <div class="message assistant">
                Bonjour ! Je suis votre assistant virtuel. 
                Comment puis-je vous aider ?<br>
                <small>(Dites : "Je voudrais prendre rendez-vous", 
                "Quels sont vos tarifs ?", ou "Quels sont vos horaires ?")</small>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-mic" id="micBtn" onclick="toggleMicrophone()">
                🎤
            </button>
            <div class="status" id="status">
                Cliquez sur le micro et parlez 📱
            </div>
        </div>
        
        <div class="input-text">
            <input type="text" id="textInput" 
                   placeholder="Ou écrivez votre message ici...">
            <button onclick="sendTextMessage()">Envoyer ✉️</button>
        </div>
    </div>

    <script>
        // URL DE VOTRE WEBHOOK n8n (TEST)
        const N8N_WEBHOOK_URL = 'https://digihapico.app.n8n.cloud/webhook-test/secretaire';
        
        let isListening = false;
        let recognition = null;
        
        // Reconnaissance vocale
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            recognition.continuous = false;
            
            recognition.onresult = function(event) {
                const texte = event.results[0][0].transcript;
                document.getElementById('status').textContent = '✅ Message envoyé';
                envoyerMessageAN8N(texte);
            };
            
            recognition.onerror = function(event) {
                document.getElementById('status').textContent = '❌ Erreur micro';
                stopListening();
            };
            
            recognition.onend = function() {
                stopListening();
            };
        } else {
            document.getElementById('status').textContent = '⚠️ Micro non supporté';
            document.getElementById('micBtn').disabled = true;
        }
        
        function toggleMicrophone() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }
        
        function startListening() {
            if (recognition) {
                recognition.start();
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('status').textContent = '🎙️ Je vous écoute...';
            }
        }
        
        function stopListening() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
            if (recognition) recognition.stop();
        }
        
        function sendTextMessage() {
            const input = document.getElementById('textInput');
            const texte = input.value.trim();
            if (texte) {
                input.value = '';
                envoyerMessageAN8N(texte);
            }
        }
        
        async function envoyerMessageAN8N(texte) {
            afficherMessage(texte, 'patient');
            document.getElementById('status').textContent = '🤔 Réflexion...';
            
            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texte })
                });
                
                const data = await response.json();
                const reponse = data.reponse || data.message || "Désolé, je n'ai pas compris.";
                
                afficherMessage(reponse, 'assistant');
                lireReponseAVoixHaute(reponse);
                document.getElementById('status').textContent = '✅ Prêt';
                    
            } catch (error) {
                afficherMessage('Désolé, une erreur est survenue.', 'assistant');
                document.getElementById('status').textContent = '❌ Erreur';
            }
        }
        
        function afficherMessage(texte, emetteur) {
            const div = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + emetteur;
            messageDiv.textContent = texte;
            div.appendChild(messageDiv);
            div.scrollTop = div.scrollHeight;
        }
        
        function lireReponseAVoixHaute(texte) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texte);
                utterance.lang = 'fr-FR';
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }
        
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendTextMessage();
        });
    </script>
</body>
</html>
